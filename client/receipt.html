<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt | BrightMinds Tutors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/tutor-logo.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
      @import url(https://fonts.googleapis.com/css?family=Playfair:300,regular,500,600,700,800,900,300italic,italic,500italic,600italic,700italic,800italic,900italic);
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      :root {
        --Primary: #0d1b2a;
        --Accent: #f5a623;
        --Background: #f9f8f4;
        --Text: #2d2d2d;
        --Success: #2ecc71;
      }
      html,
      body {
        width: 100%;
        font-family: 'Inter', sans-serif;
        background: var(--Background);
        color: var(--Text);
        padding-block: 20px;
      }
      .receipt {
        max-width: 820px;
        margin: 20px auto;
        background: #ffffff;
        border-radius: 14px;
        padding: 22px 24px;
        box-shadow: 0 25px 60px rgba(13, 27, 42, 0.06);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(13, 27, 42, 0.06);
        padding-bottom: 14px;
      }
      .brand{
            display: grid;
            align-items:center;
            gap:10px
        }

        .logo{
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo img{
            width: 35px;
            height: 35px;
        }

        .logo p{
            color: var(--Primary);
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        .brand span{
        }
        .eyebrow {
          color: var(--Accent);
          font-size: 0.78rem;
          font-weight: 800;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          margin-bottom: 8px;
        }
      .status {
        background: #D1FAE5;
        color: var(--Success);
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.9rem;
      }
      .hero {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 18px 0;
        border-bottom: 1px solid rgba(13, 27, 42, 0.04);
      }
      .label {
        color: rgba(45, 45, 45, 0.6);
        font-size: 0.85rem;
        margin-bottom: 6px;
      }
      .amount {
        font-size: 1.6rem;
        color: var(--Primary);
        display: block;
      }
      .reference {
        font-weight: 700;
        color: rgba(13, 27, 42, 0.9);
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        padding: 18px 0;
      }
      .box {
        background: rgba(249, 248, 244, 0.92);
        padding: 14px;
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(13, 27, 42, 0.04);
      }
      .box h2,
      .box h3 {
        margin: 6px 0;
        color: var(--Primary);
      }
      .details {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(13, 27, 42, 0.04);
      }
      .details div {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
      }
      .items {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(13, 27, 42, 0.04);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
      }
      .row.head {
        font-weight: 700;
        color: rgba(45, 45, 45, 0.7);
        border-bottom: 1px solid rgba(13, 27, 42, 0.04);
        padding-bottom: 10px;
      }
      .row.item span {
        color: rgba(45, 45, 45, 0.85);
      }
      .row.total {
        font-weight: 800;
        font-size: 1.05rem;
        border-top: 1px dashed rgba(13, 27, 42, 0.06);
        padding-top: 12px;
      }
      .footer {
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid rgba(13, 27, 42, 0.04);
        text-align: center;
        color: rgba(45, 45, 45, 0.7);
      }
    .footer a{
      text-decoration: none;
      color: rgba(45, 45, 45, 0.7);
    }
    .download-btn{
      position: relative;
      /* top: 70%; */
      left: 45%;
      /* margin-block: 30px; */
      padding: 20px;
      font-weight: 600;
      cursor: pointer;
      background-color: var(--Primary);
      color: #ffffff;
      border: none;
      border-radius: 30px;
      transition: all 0.2s;
    }
    .download-btn:hover{
      transform: translateY(-3px);
    }
    .download-btn:hover i{
      margin-left: 3px;
    }
      @media (max-width: 720px) {
        .receipt {
          margin: 16px 12px;
          padding: 18px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
        .details {
          grid-template-columns: 1fr;
        }
        .hero {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="receipt">
      
    </div>
    <button class="download-btn">
      Download reciept
      <i class="fa-solid fa-download"></i>
    </button>

    <script type="module" src="./js/scripts/receipt.js"></script>
  </body>
</html>
